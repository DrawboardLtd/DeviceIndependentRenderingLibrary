name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Release notes for the chain, one entry per Major.Minor. The version NUMBER is deliberately not
  # here any more — it lives in src/Directory.Build.props (VersionMajorMinor) and the build job reads
  # it back, so it cannot drift from what the packages declare. Add the entry here when you bump it
  # there. (The entries stay in the yml rather than moving next to the number because several contain
  # `--`, which is illegal inside an XML comment.)
  # 6.4 - MTSDF rasterization path (RasterizeGlyphMtsdf) + glyph-identity resolver
  #       (ResolveGlyphIdentity) and Type1-by-name MTSDF; drops the stb PNG port
  #       (SharpAstro.Fonts 1.5 / Png 3.4).
  # 6.7 - DIR.Lib.Shaping ITextShaper adapter with full UAX #9 bidi.
  # 6.8 - rebuild against SharpAstro.Fonts.Shaping 1.5.551; + SignalDirectory source
  #       generator (DIR.Lib.SourceGenerators) + SignalJson binder.
  # 6.9 - memoize ResolveGlyphIdentity (session-stable identity cache) +
  #       SharpAstro.Fonts 1.6 (bare-CFF CIDFontType0 loading).
  # 6.11 - hoist the backend-neutral SDF atlas core into DIR.Lib: SdfFontAtlas owns
  #        keying / packing / LRU / budgets / disk cache / async rasterize, GPU backends
  #        implement ISdfAtlasBackend; SdfGlyphDiskCache moved here from SdlVulkan.Renderer
  #        (.sdfg FormatVersion 6, + read-only mode for single-threaded hosts); AtlasDiag.
  # 6.13 - selectable-text channel (DrawSelectableText + SelectableTextRegion) + menu
  #        font-cap for narrow surfaces; + per-instance SdfFontAtlas raster size / page
  #        cap / saturation refusal for tiered (large-text) atlases.
  # 6.14 - responsive layout primitives: clamped Star sizing, collapse-below-minimum,
  #        and a Wrap flow container in DIR.Lib.Layout.
  # 6.15 - input primitives: ListScrollController (atom scroll model) + PanZoomController +
  #        TapOrDragGesture; PixelWidgetBase owns DpiScale / FontPath / EmojiFontPath and
  #        promotes TrackSlider (DrawTrackSlider / TrackFrac); RectF32 RenderTextInput overload.
  # 6.16 - hyperlink support on the selectable-text + click channels: SelectableTextRegion.Href
  #        + HitResult.LinkHit(Url). Additive (optional field + overload + new HitResult subtype).
  # 6.17 - DeviceTransform: constrained content->device affine (Rotation90 in {0,90,180,270} +
  #        uniform scale + translation) exposed as Renderer.DeviceTransform; GPU backends fold it
  #        into the projection. Additive, defaults to Identity (byte-identical until a consumer sets it).
  # 6.18 - SearchInteraction<TResult> base for text-search controls.
  # 6.19 - overflow-scrolling dropdown menus + declarative Layout.Progress bar.
  # 6.20 - Renderer.FillRoundedRectangle as a base-renderer virtual (the default decomposes into
  #        non-overlapping scanline spans, so a translucent colour cannot double-blend at the
  #        corners); a zero radius is exactly FillRectangle. BEHAVIOUR CHANGE alongside it:
  #        RgbaImage.FillRect applied the FIRST pixel's opaque-destination verdict to the whole SIMD
  #        vector, leaving alpha 192 where the scalar tail correctly wrote 255. Translucent-over-opaque
  #        now yields 255; RGB is bit-identical. RGBA goldens of that shape need re-recording.
  # 6.21 - Layout.Node.CornerRadius + the .Radius(designUnits) fluent. Chrome only: arrange never sees
  #        it, so a rounded node occupies and insets exactly the rect a square one would.
  # 6.22 - grid rows can size to their own content; text resolves emoji runs to the emoji font per run.
  # 7.0 - BREAKING: DeviceTransform is now ContentTransform (the type and the Renderer property), and
  #       design units resolve PER AXIS, so a surface unit need not be square.
  # 7.1 - the debug inspector's surface-agnostic half is hoisted here (Diagnostics/DebugInspectorCore),
  #       so a host keeps only its surface verbs instead of a private transport too.
  # 7.2 - the inspector answers discovery, and says what kind of surface it is (SurfaceKind).
  # 7.3 - the inspector core can express a FRAME-SPANNING command: IDebugInspectorOperation (Exclusive /
  #       Timeout / Advance) + IDebugInspectorSteppedHost, so `batch` and `wait` become core verbs and a
  #       host with frame-spanning verbs no longer needs to keep a private scheduler.
  # 7.4 - a CELL-authored tree arranges on a pixel surface: PixelMeasureContext gains per-axis scales plus a
  #       CellAuthored factory, the mirror of Console.Lib's CellMeasureContext.PixelAuthored, so a tree
  #       authored in either unit convention arranges on either surface. fontSize rides the VERTICAL scale,
  #       because an em is a height. Alongside it, PixelWidgetBase's Arrange/Paint/RenderLayout gain overloads
  #       taking the CONTEXT itself, so the painter reads FontPath/FontScale/radius from the same object the
  #       measure pass used instead of a hand-threaded scalar. The scalar overloads delegate to the context
  #       ones with an isotropic context, so existing callers paint byte-identically. ADDITIVE.
  # 7.5 - fonts are found by the family they declare, and every face of a collection is reachable.
  #       FontResolver indexes each installed face's own 'name' table (SharpAstro.Fonts 1.7), so a face whose
  #       file name isn't its family resolves (Segoe UI Symbol lives in seguisym.ttf) and so does one with no
  #       file name at all (anything past face 0 of a .ttc). FontFaceId is the id those return — a plain path
  #       for a single-face font, path#index for a collection — honoured by ManagedFontRasterizer and the
  #       fallback resolver. FontFallbackResolver gains TryResolveFont/CanRender (it could not previously
  #       report "nothing covers this"), role-based construction (FromRoles: primary/symbol/emoji/scripts),
  #       and an allocation-free span run split. PixelWidgetBase.FontFallback + PixelMeasureContext.Fallback
  #       carry it into the declarative layout, so a text leaf splits per run instead of drawing whole in one
  #       font. FIX: the all-ASCII shortcut is now gated on the primary actually covering ASCII. ADDITIVE.
  # 7.6 - the SDF atlas core and its GPU backend can no longer drift apart. Core pages and backend pages are
  #       correlated by index alone, and AllocateNewPage appended to the core list BEFORE the backend was
  #       asked to allocate — so a backend that failed mid-hook (descriptor pool or device memory exhausted)
  #       left the core permanently one page longer, mis-addressing every later page. The core append now
  #       rolls back when the hook throws, restoring the append cursor and counters. FIX: Dispose no longer
  #       propagates a backend teardown failure — it runs on the GPU-error recovery path, where throwing
  #       replaced the error that started the recovery with a bare IndexOutOfRange and killed the process
  #       with the remaining pages still allocated. ADDITIVE.
  # 7.9 - a PDF font's own /Encoding now decides which glyph a char code selects. The registered
  #       encoding map (base encoding + /Differences) was consulted for Type1 fonts only; every other
  #       embedded font went straight to cmap/char-code strategies, so a name-keyed CFF with no cmap
  #       and no built-in encoding bottomed out at charCode-as-GID and drew an unrelated glyph.
  #       ResolveGlyphIdentity and the three charCode-taking rasterize entry points now try the
  #       encoding's named glyph first, via SharpAstro.Fonts 1.8's GetGlyphIdByName. TrueType faces
  #       return 0 from the name route and fall through unchanged; an unknown name falls through
  #       rather than blanking the glyph. RegisterType1Encoding is renamed RegisterPdfEncoding (the
  #       map applies to any embedded simple font) with the old name kept as an [Obsolete] forwarder.
  # 7.10 - TabBar takes a colour palette instead of hard-coding one. Its eight colours were private
  #        static fields, so a consumer could not theme the strip at all -- an app offering a light mode
  #        had a dark band across the top of every window and no way to change it. TabBarColors is a
  #        record whose defaults are the values the bar has always drawn, so a consumer that sets nothing
  #        is unchanged, and TabBar.Colors is settable (like Scale) because a theme can flip while the bar
  #        is alive. Surfaces and text are separated from ActiveAccent deliberately: the accent means
  #        "this is the tab you are on", which reads the same on a light strip as a dark one, so theming
  #        it changes what it communicates rather than how it reads.
  #       Requires SharpAstro.Fonts 1.8. ADDITIVE.
  # 7.11 - BREAKING, see MIGRATION.md. UiPalette gains eight roles (Accent, AccentAlt, Focus,
  #        SeparatorStrong, Success, Info, Warn, Error) and becomes a sealed record with required
  #        members instead of a positional readonly record struct. Two reasons, both load-bearing.
  #        A record struct always has an implicit parameterless constructor that property
  #        initializers do not run, so default(UiPalette) was all-zero: transparent black, painted
  #        silently with nothing on screen to say why. required makes the omission a compile
  #        error. And a positional record cannot grow without breaking every call site,
  #        which is exactly what a palette has to do. Five roles are DERIVED (SeparatorStrong,
  #        HeaderText, AccentAlt, Focus, Success default to the role they extend) so a palette with
  #        one rule weight or one accent need not invent a second; the fallback is stored in
  #        nullable backing fields, so `with` keeps an unstated role unstated. HeaderText moves
  #        from required to derived-from-Accent, so a palette that omits it now gets the accent
  #        rather than a compile error. Adds MenuColors.FromPalette, the menu counterpart of
  #        TabBarColors.FromPalette from 7.10, and UiPalette.IsDark computed from ContentBg so it
  #        cannot disagree with the colours it describes.
  # 7.12 - Additive. TextInputRenderer takes a palette, the same shape TabBar got in 7.10: a
  #        TextInputColors record whose defaults are the values it has always drawn, a FromPalette
  #        factory, and a settable TextInputRenderer.Colors derived when the theme MOVES rather
  #        than per frame. A consumer that sets nothing is unchanged. The renderer previously held
  #        eight private static readonly colours, which are the first consumer's dark scheme frozen
  #        into a shared widget: a themed app could restyle every surface it draws itself and still
  #        get a slate-blue box in the middle of it. Two derivation choices worth knowing: the
  #        field's ground comes from ContentBg rather than PanelBg, because a field sits on a panel
  #        and has to read as recessed into it with focus lifting it halfway back; and the caret
  #        takes the accent rather than the text colour, since on a palette with one hue to spend a
  #        caret in the text colour is invisible against the text beside it.
  #        ALSO IN 7.12, and missing from these notes until 7.15 was written -- a BEHAVIOUR CHANGE
  #        that shipped unannounced, recorded here late rather than left unrecorded: a whitespace
  #        codepoint's advance now comes from the font's own hmtx table instead of being borrowed
  #        from the 'n' glyph. An ink-free outline threw its advance away, and measurement fell back
  #        to 'n'. In DejaVu Sans a space is 651/2048 em and 'n' is 1303/2048, so every measured
  #        space was 1.99x too wide. Any layout whose width depends on spaces therefore MOVES on
  #        7.12: narrower, by nearly half a space per space. Specifically, a column padded with
  #        spaces that lined up only because a space measured like a digit stops lining up, and the
  #        fix downstream is to pad with U+2007 FIGURE SPACE, which a font defines to advance like a
  #        digit, rather than to widen a tolerance around a premise that was never true.
  # 7.13 - No API change: rebuild against SharpAstro.Fonts / .Shaping 1.11, skipping the 1.10 pin
  #        the repo never took. Glyph RENDERING moves, in three places, all wrong-to-right.
  #        1.11: an embedded PDF subset whose only cmap subtable is Mac Roman (1,0) now selects
  #        through it instead of falling back to using the char code as a glyph index. That shape
  #        is what macOS Quartz writes, and the guess failed two ways at once — inside a large
  #        subset it picked an unrelated glyph, so Korean body text rendered as correctly-shaped
  #        nonsense in codepoint-sorted order, while a 2-20 glyph Latin subset indexed off the end
  #        and rendered nothing, dropping commas, list markers and page numbers.
  #        1.10: three compounding TrueType hint-interpreter defects (a twilight zone that reported
  #        zero points forever, an ALIGNRP guard that returned without popping its operands, and
  #        'cvt ' read unsigned when FWORD is signed), plus GPOS mark attachment propagating the
  #        RTL way in RTL runs. Hinted TrueType faces and Arabic with marks both change.
  # 7.14 - A glyph the SDF atlas can never rasterize is given up on after three attempts and recorded
  #        blank, instead of being retried forever. A failed rasterization released its in-flight claim
  #        so a later frame could retry, which is right for the one failure that heals itself: an
  #        embedded "mem:" subset font losing the race with its own registration. But nothing counted
  #        the attempts, and the caller re-offers the whole visible glyph set every frame, so a glyph
  #        that could NEVER rasterize was re-claimed indefinitely and _rasterizeInFlight never emptied
  #        -- which pins IsDirty true. Any permanent font failure therefore presented as "the render
  #        never settles", with nothing on screen or in the log naming a font: in the PDF viewer it
  #        arrived as an offscreen golden-image diff and cost a day in the render pipeline. Past the
  #        bound the glyph draws as nothing, the atlas reports clean, and one line per FONT (not per
  #        glyph -- a font that never registers fails hundreds) names the glyph, the attempt count, and
  #        whether the font is registered by the time we gave up. Counters reset on evict-all, so a
  #        font registered later still gets a fresh bound. Also adds
  #        ManagedFontRasterizer.IsFontRegistered, the predicate every rasterize entry point already
  #        failed on implicitly -- a background caller can state it in its own diagnostics rather than
  #        quote a stale exception message. Synced from upstream DIR.Lib 7.13.
  # 7.15 - BEHAVIOUR CHANGE, and a fix no consumer could work around. TextFit.ShrinkToWidth returned a
  #        size it had never measured, so a run fitted with TextTrim.Shrink could be drawn PAST the rect
  #        it was just fitted to. It refined by ratio -- size *= maxWidth / measured, up to four passes
  #        -- then returned the last estimate unverified, on the premise its own remarks stated out
  #        loud: "advance widths scale linearly with the size, so one division lands on the answer".
  #        They scale linearly in the IDEAL advance. A rasterizer quantizes the size to whole pixels
  #        before measuring, so measured width is a STEP function of the requested size and every
  #        estimate inside one step measures identically. The ratio then reapplies the same factor
  #        every pass and converges to a fixed point still ABOVE the budget. Now, once the ratio stops
  #        making progress the search steps down WHOLE sizes -- the grid the rasterizer actually has,
  #        so each step is the next distinct width available rather than another estimate inside the
  #        same one -- and returns the first size MEASURED to fit, which is now a guarantee the remarks
  #        can state. minFontSize stays the only value allowed to overflow: a run that cannot fit even
  #        at the floor should overflow where a reader can see it rather than shrink away to nothing.
  #        The fast path (it already fits) is untouched, so the common case does not pay for this.
  #        What MOVES, and for whom: a run fitted with Shrink that used to sit a fraction of a pixel
  #        over its rect now takes the next whole size down, so a golden image containing shrunk text
  #        differs by one size step. TextTrim.Shrink is OPT-IN and the default is End, so a consumer
  #        that never asks for it renders byte-identically -- which is why this is a minor and not a
  #        major. The PDF viewer is such a consumer: it names neither ShrinkToWidth nor TextTrim.Shrink
  #        anywhere, so nothing it draws moves.
  #        Also makes the tests able to see this class of bug at all. The stub renderer they measured
  #        with was CONTINUOUS (length * fontSize * 0.5), so no plateau existed and the bug was
  #        unreachable by construction; a quantizing oracle now sweeps budgets and asserts the
  #        INVARIANT -- what comes back fits -- instead of one arithmetic answer.
  #        Synced from upstream DIR.Lib 7.14.
  # 7.16 - Additive, synced from upstream DIR.Lib 7.15. TabBar can draw a "+" after the last tab, the
  #        way a terminal or a browser does: ShowNewTabButton, NewTabActive, NewTabHovered, and
  #        HitNewTabButton to report the click. A consumer that sets nothing is unchanged. It belongs in
  #        the bar because the bar owns the tab widths and published no edge to place the button against,
  #        so a host had to either duplicate that arithmetic or park the button at the strip's far end,
  #        where it reads as a toolbar rather than as the next slot. HandleMouseDown returns null over
  #        the button rather than inventing a tab index, so a host that forgets HitNewTabButton swallows
  #        the click instead of activating tab 0. The viewer's dashboard is the first consumer.
  # 7.17 - Additive, synced from upstream DIR.Lib 7.16. TabBar.Pointer hands the bar the mouse position
  #        and it hovers itself from there: the tab under the pointer takes the active plate and label,
  #        and the close mark inside that tab gets a plate of its own. NewTabHovered still works and now
  #        ORs with it; a consumer that leaves Pointer null renders exactly as before. A position rather
  #        than a hovered index, because the bar owns the tab widths, so a host supplying an index would
  #        be hit-testing the PREVIOUS frame's geometry, which lags on the frame a tab opens, closes or
  #        is dragged past a still pointer. Hover reuses ActiveBackground rather than adding a palette
  #        role: it previews what clicking gives you, UiPalette names no hover surface, and blending one
  #        would paint a colour the theme never chose. The close plate is Separator, the one role that
  #        reads against both the panel and the header surface.
  # 7.18 - Six rounds, five of which shipped under 7.17 without saying so; this entry covers them.
  #        Synced from upstream DIR.Lib 7.18 through 7.25, all additive:
  #          * Content.Icon -- a NAMED mark leaf (check, chevron, caret, theme marks, ...) drawn from
  #            rectangles at the size it declares, so a tree states a mark instead of a drawFill hook.
  #          * CrossAlign on a Stack: align-items, stated on the CONTAINER. Without it a fixed-height
  #            child in a taller bar hugs the top and centring means a spacer sandwich at the call site.
  #          * The cursor as a property of a clickable region (CursorKind, RegisterCursor,
  #            HitTestCursor, HitResult.ChromeHit) -- so a host stops maintaining a geometry predicate
  #            that every new overlay silently invalidates. TextInputColors became a per-call parameter
  #            at the same time, since pushing a static around a draw is not a thing a caller should do.
  #          * IconKind.CaretUp / CaretDown, and Content.Text.WidthSample: a readout reserves the room
  #            its widest reading needs, so the text beside it stops shuffling as the number changes.
  #          * Padding per axis (PaddingY, .Pad(across, down), .PadX) -- a fixed-height bar has room
  #            either side of a label and none above or below.
  #          * Clipping the software renderer honours, and PixelWidgetBase.PushClip(x, y, w, h) /
  #            PopClip so a widget can state one. RgbaImageRenderer ignored the clip, which the base
  #            permits and a widget TEST does not: a control that trims content to its bounds paints
  #            over the whole picture, and the headless render then disagrees with the app about what
  #            was drawn. Clear still replaces rather than blends, and the direct-Pixels glyph blit
  #            respects it too -- that one was the last thing painting outside a clip.
  # 7.19 - Synced from upstream DIR.Lib 7.26. Renderer.DrawTriangles: a triangle list, x/y pairs, three
  #        vertices per triangle. Anything not made of rectangles, ellipses and text IS one -- an
  #        arrowhead, a chevron, a chart's filled area -- and a widget that cannot say so reaches past
  #        the abstraction to whichever backend can, which is enough on its own to pin a UI layer to one
  #        renderer. The default is a scanline fill in terms of FillRectangle, so every backend has it;
  #        a GPU renderer overrides it with one draw call.
  # 7.20 - Synced from upstream DIR.Lib 7.27. PushClip/PopClip nest: a push inside a push draws in the
  #        INTERSECTION, and a pop restores the enclosing clip rather than the whole surface, so a child
  #        states its own bounds and cannot escape its parent's. Single-level read as a simplification
  #        and was not one -- a panel clipping to its bounds and then per row had to intersect the two by
  #        hand and re-push its OWN rect to get back, and "pop" degenerated into "reset", which works
  #        only while every backend sets the region absolutely. An unmatched pop now throws. BREAKING for
  #        backends: PushClip/PopClip are no longer virtual; a clipping backend overrides ApplyClip(rect)
  #        and ClearClip() instead, since the stack lives in the base. Renderer.ClipDepth reports the
  #        nesting, and RectInt gains Normalized() + Intersect().
  # 7.21 - Synced from upstream DIR.Lib 7.28. Layout.Builder.TextInput(state, fontSize) declares an
  #        editable field: the painter draws it, registers the TextInputHit over the arranged rect and
  #        states CursorKind.Text, so click-to-focus, blur-on-outside, Tab order and the I-beam follow
  #        from a registration it cannot forget. It replaces a keyed Fill plus a painter branch keyed by
  #        a magic string -- an identity nothing checks, where a typo yields a silently blank field, and
  #        Fill means "the app paints something arbitrary here", which a text box is not. TextInputFocus
  #        owns which field has the keyboard (a settable pointer let code change focus without the
  #        platform side effects, leaving the app taking no input while the IME stayed up), and
  #        TextInputInteraction moves in from a consumer's UI project so Tab cycling and commit dispatch
  #        are testable without a GUI. TextInputRenderer no-ops without a font, like the text helpers.
  # 7.22 - Synced from upstream DIR.Lib 7.29. Non-Latin text input, and per-window values stop being
  #        copied per widget. BREAKING in three places.
  #        * IME composition. TextInputState carries the in-progress preedit (Composition /
  #          CompositionCursor / CompositionLength / IsComposing); TextInputRenderer draws it inline,
  #          underlined, and RETURNS the caret rect so a host can answer SDL_SetTextInputArea. A field
  #          handling only committed text cannot accept CJK at all: with an IME every keystroke before the
  #          commit is composition and nothing else arrives. TextInputInteraction swallows Enter/Escape/
  #          Backspace while composing, since those belong to the candidate list, not the field.
  #        * A field draws through the FALLBACK CHAIN. The layout painter splits TEXT LEAVES into coverage
  #          runs, but a field's content is not a leaf, so TextInputRenderer takes the resolver and measures
  #          the caret through the same chain. Without it a field holding correct CJK renders blank -- the
  #          characters are there and the face has no glyphs. FontResolver.ResolveSystemScriptFonts()
  #          resolves the platform's CJK/Indic faces, portable Noto names appended on EVERY platform.
  #        * WindowUiSettings: DPI scale, fonts and the fallback chain live once per WINDOW and are SHARED
  #          by reference (PixelWidgetBase.ShareUiContext), instead of each widget holding a copy kept in
  #          agreement by an overridden setter naming every child. The properties still exist and still
  #          forward, so a consumer setting them keeps compiling; what changes is that a composite shares
  #          the object once instead of pushing each value to each child. IPixelWidget gains Ui.
  #        * DropdownMenuState is generic over what an entry MEANS (DropdownItem<T>), so selecting hands
  #          back the entry rather than an index the caller maps through a switch that has to agree with
  #          the label order. Entries carry IsEnabled + Tooltip: a disabled row greys, states its reason ON
  #          the row, is skipped by the arrows, and swallows its click instead of falling through to the
  #          backdrop (which would close the menu, making it behave like a working row). RenderDropdownMenu
  #          is generic to match; the viewer has no dropdown, so this one is inert here.
  #        * An open overlay claims the keyboard by BEING PAINTED (WindowUiSettings.KeyboardClaimant +
  #          IKeyboardClaimant), and the host asks once, instead of every widget owning an overlay adding a
  #          routing case to its own input switch. Paint order is z-order, so the topmost claims last and
  #          wins; a claimant no longer displayed declines, so a stale claim needs no clearing.
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release
  # The build job CAPTURES a dotnet invocation's stdout to resolve the version, so the SDK's
  # first-run banner must not be able to land in it.
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Resolve version prefix
      # Read the version back from the one place it is written (src/Directory.Build.props) instead of
      # restating it here — CI stamps -p:Version across every package, so a hard-coded copy here could
      # ship packages whose version disagrees with the one they declare. -getProperty only EVALUATES
      # the file: nothing is built and no restore is needed, so this can run before restore.
      # The value is CAPTURED, so nothing else may print to stdout: DOTNET_NOLOGO (workflow env) keeps
      # the SDK first-run banner out — this is the job's first dotnet call — and the shape check makes
      # anything else unexpected, or a renamed property, fail the run rather than quietly stamping
      # every package ".<run>".
      run: |
        MM="$(dotnet msbuild src/Directory.Build.props -getProperty:VersionMajorMinor -nologo)"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from src/Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        echo "VERSION_PREFIX=${MM}.${{ github.run_number }}" >> "$GITHUB_ENV"
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Test
      run: dotnet test -c $BUILD_CONF --no-build
    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5
